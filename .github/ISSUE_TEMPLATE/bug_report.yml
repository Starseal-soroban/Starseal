name: Bug report
description: Something in Starseal doesn't work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here. Follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Verifier contract
        - SDK
        - CLI
        - Examples
        - Docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, code or a transaction hash. Smaller is better.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Local
        - Testnet
        - Other
