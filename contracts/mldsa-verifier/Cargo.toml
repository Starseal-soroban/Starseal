[package]
name = "starseal-mldsa-verifier"
description = "OpenZeppelin-compatible ML-DSA (FIPS 204) verifier for Soroban smart accounts, using the Protocol 30 host functions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Independent ML-DSA implementation used only to produce signatures in tests,
# so the host's verifier is checked against a second implementation.
fips204 = { version = "0.5.0", default-features = false, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
